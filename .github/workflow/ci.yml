name: Neovim Config CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: チェックアウト
      uses: actions/checkout@v4

    - name: Neovim のインストール
      uses: rhysd/action-setup-vim@v1
      with:
        neovim: true
        version: stable

    - name: 設定ファイルの構文・起動チェック
      run: |
        nvim --headless +q
